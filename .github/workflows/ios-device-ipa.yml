name: iOS device IPA

# Unsigned arm64 iPhone/iPad build for AltStore Classic.
# AltServer signs the IPA with the user's Apple ID. This job has no Apple certificate or secret.

on:
  workflow_dispatch:
    inputs:
      bundle_id:
        description: Bundle identifier to register with your Apple ID
        required: false
        default: com.wesbos.housecapture
        type: string
  push:
    branches: [main]
    paths:
      - "apps/house-capture/**"
      - ".github/workflows/ios-device-ipa.yml"

permissions:
  contents: read
  actions: write

concurrency:
  group: ios-device-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ipa:
    name: Unsigned arm64 iPhone IPA
    runs-on: xcode-27
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      BUNDLE_ID: ${{ github.event.inputs.bundle_id || 'com.wesbos.housecapture' }}
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 27
        run: |
          set -euo pipefail
          if [ -d /Applications/Xcode_27.1.app ]; then
            sudo xcode-select -s /Applications/Xcode_27.1.app
          elif [ -d /Applications/Xcode_27.app ]; then
            sudo xcode-select -s /Applications/Xcode_27.app
          fi
          xcodebuild -version
          xcodebuild -showsdks | awk '/iphoneos/'

      - name: Install XcodeGen 2.46.0
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/xcodegen.zip" \
            https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip
          rm -rf "$RUNNER_TEMP/xcodegen"
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP/xcodegen"
          BIN="$(find "$RUNNER_TEMP/xcodegen" -type f -name xcodegen -print -quit)"
          if [ -z "$BIN" ]; then
            echo "XcodeGen binary was not in the release archive"
            find "$RUNNER_TEMP/xcodegen" -maxdepth 4 -print
            exit 1
          fi
          chmod +x "$BIN"
          xattr -dr com.apple.quarantine "$BIN" || true
          codesign --force --sign - "$BIN" || true
          echo "$(dirname "$BIN")" >> "$GITHUB_PATH"
          "$BIN" --version

      - name: Generate the Xcode project
        working-directory: apps/house-capture
        run: |
          set -euo pipefail
          xcodegen generate --spec project.yml
          xcodebuild -project HouseCapture.xcodeproj -list

      - name: Build for physical iOS devices
        working-directory: apps/house-capture
        run: |
          set -euo pipefail
          if ! [[ "$BUNDLE_ID" =~ ^[A-Za-z][A-Za-z0-9-]*(\.[A-Za-z][A-Za-z0-9-]*)+$ ]]; then
            echo "Bundle identifier is not usable: $BUNDLE_ID"
            exit 1
          fi
          xcodebuild \
            -project HouseCapture.xcodeproj \
            -scheme HouseCapture \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            2>&1 | tee "$RUNNER_TEMP/xcodebuild.log"

      - name: Package an unsigned IPA
        working-directory: apps/house-capture
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos/HouseCapture.app"
          if [ ! -d "$APP" ]; then
            echo "Device build did not produce HouseCapture.app"
            find "$RUNNER_TEMP/DerivedData/Build/Products" -name "*.app" -print
            exit 1
          fi
          xattr -cr "$APP" || true
          codesign --remove-signature "$APP" || true
          rm -rf "$APP/_CodeSignature"
          rm -f "$APP/embedded.mobileprovision"

          STAGE="$RUNNER_TEMP/ipa-root"
          rm -rf "$STAGE"
          mkdir -p "$STAGE/Payload"
          cp -R "$APP" "$STAGE/Payload/HouseCapture.app"

          BIN="$STAGE/Payload/HouseCapture.app/HouseCapture"
          ARCHS="$(lipo -archs "$BIN")"
          echo "Architectures: $ARCHS"
          if [ "$ARCHS" != "arm64" ]; then
            echo "Expected a single arm64 device slice"
            file "$BIN"
            exit 1
          fi
          PLATFORM="$(otool -l "$BIN" | awk '/LC_BUILD_VERSION/{f=1} f && $1=="platform"{print $2; exit}')"
          MINOS="$(otool -l "$BIN" | awk '/LC_BUILD_VERSION/{f=1} f && $1=="minos"{print $2; exit}')"
          SDK="$(otool -l "$BIN" | awk '/LC_BUILD_VERSION/{f=1} f && $1=="sdk"{print $2; exit}')"
          echo "LC_BUILD_VERSION platform=$PLATFORM minos=$MINOS sdk=$SDK"
          if [ "$PLATFORM" != "2" ]; then
            echo "platform 2 is the iOS device platform. This binary is not a device build."
            exit 1
          fi

          PLIST="$STAGE/Payload/HouseCapture.app/Info.plist"
          PLIST_MIN="$(plutil -extract MinimumOSVersion raw "$PLIST")"
          PLIST_ID="$(plutil -extract CFBundleIdentifier raw "$PLIST")"
          PLIST_EXE="$(plutil -extract CFBundleExecutable raw "$PLIST")"
          echo "Info.plist id=$PLIST_ID min=$PLIST_MIN exe=$PLIST_EXE"
          if [ "$PLIST_MIN" != "17.0" ] || [ "$PLIST_ID" != "$BUNDLE_ID" ] || [ "$PLIST_EXE" != "HouseCapture" ]; then
            echo "Built Info.plist does not match the HouseCapture device target"
            exit 1
          fi
          if [ -e "$STAGE/Payload/HouseCapture.app/embedded.mobileprovision" ]; then
            echo "A provisioning profile was embedded"
            exit 1
          fi
          set +e
          codesign --verify --verbose=2 "$STAGE/Payload/HouseCapture.app" >"$RUNNER_TEMP/codesign.txt" 2>&1
          SIGNED=$?
          set -e
          cat "$RUNNER_TEMP/codesign.txt"
          if [ "$SIGNED" -eq 0 ]; then
            echo "The bundle still has a valid signature"
            exit 1
          fi

          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent "$STAGE/Payload" "dist/HouseCapture-unsigned.ipa"
          unzip -t "dist/HouseCapture-unsigned.ipa"
          LIST="$(unzip -Z1 "dist/HouseCapture-unsigned.ipa")"
          awk 'NR<=8' <<< "$LIST"
          grep -qx "Payload/HouseCapture.app/Info.plist" <<< "$LIST"
          grep -qx "Payload/HouseCapture.app/HouseCapture" <<< "$LIST"
          if grep -q "embedded.mobileprovision" <<< "$LIST"; then
            echo "Provisioning profile is inside the IPA"
            exit 1
          fi
          ls -lh dist/HouseCapture-unsigned.ipa

          {
            echo "### HouseCapture unsigned IPA"
            echo "- Xcode: $(xcodebuild -version | tr '\n' ' ')"
            echo "- Scheme: HouseCapture, configuration Release, SDK iphoneos"
            echo "- Bundle ID: $PLIST_ID"
            echo "- Minimum iOS: $PLIST_MIN (Mach-O minos $MINOS, SDK $SDK)"
            echo "- Architecture: $ARCHS device binary (LC_BUILD_VERSION platform $PLATFORM)"
            echo "- Apple certificate and provisioning profile: absent"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: HouseCapture-unsigned-ipa
          path: apps/house-capture/dist/HouseCapture-unsigned.ipa
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

      - name: Upload Xcode build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: ${{ runner.temp }}/xcodebuild.log
          if-no-files-found: ignore
          retention-days: 14
